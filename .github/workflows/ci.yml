name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check harness tests
      - run: ruff format --check harness tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U harness"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest (${{ matrix.database }})
        env:
          HARNESS_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+asyncpg://harness:harness@localhost:5432/harness_test' || '' }}
        run: pytest -v
